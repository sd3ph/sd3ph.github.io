<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTech-AID-Core Splash Slideshow</title>
<style>
:root{--ink1:#00e5ff;--ink2:#ff2d95;--ink3:#ffb800;--bg:#07080f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:#fff;font-family:'Segoe UI',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden}

/* drifting colour blobs behind the stage */
.blob{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:float 18s ease-in-out infinite alternate}
.b1{background:var(--ink1);top:-15vmax;left:-12vmax}
.b2{background:var(--ink2);bottom:-18vmax;right:-10vmax;animation-delay:-6s}
.b3{background:var(--ink3);top:30%;left:40%;width:28vmax;height:28vmax;opacity:.2;animation-delay:-11s}
@keyframes float{to{transform:translate(8vmax,-6vmax) scale(1.2)}}

.stage{width:1600px;height:600px;flex:none;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px;
  background:rgba(255,255,255,.05);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:28px;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.8);transform-origin:center}

.panel{position:relative;border-radius:18px;overflow:hidden;background:#000;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.panel:nth-child(1){border-radius:18px 60px 18px 60px}
.panel:nth-child(2){border-radius:60px 18px 60px 18px}
.panel img,.panel .ink{position:absolute;inset:0;width:100%;height:100%}
.panel img{object-fit:cover}
.panel .ink{background:linear-gradient(115deg,var(--ink1),var(--ink2),var(--ink3));clip-path:circle(0)}
.panel .top{clip-path:circle(0)}

canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}

.hud{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 22px 10px 16px;border-radius:999px;background:rgba(7,8,15,.62);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.18);font-size:14px;letter-spacing:.04em;overflow:hidden}
.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--ink1),var(--ink2));animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,149,.7)}100%{box-shadow:0 0 0 12px rgba(255,45,149,0)}}
.bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--ink1),var(--ink2),var(--ink3))}

@media (prefers-reduced-motion:reduce){.blob,.dot{animation:none}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="stage" id="stage">
  <div class="panel" id="p1"><img class="base" alt=""><div class="ink"></div><img class="top" alt=""></div>
  <div class="panel" id="p2"><img class="base" alt=""><div class="ink"></div><img class="top" alt=""></div>
  <canvas id="fx" width="1600" height="600"></canvas>
  <div class="hud"><span class="dot"></span>BTech-AID-Core (Batch 2025)<div class="bar" id="bar"></div></div>
</div>

<script>
const TOTAL = 47, HOLD = 3200, DUR = 1500;
const COLORS = ['#00e5ff','#ff2d95','#ffb800','#ffffff','#8a5cff'];
const stage = document.getElementById('stage');
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
const bar = document.getElementById('bar');

// fit the fixed 1600x600 stage to any screen
function fit(){ stage.style.transform = `scale(${Math.min(innerWidth/1640, innerHeight/640)})`; }
addEventListener('resize', fit); fit();

// shuffled deck, no repeats on screen
let deck = [];
function draw(avoid){
  if (deck.length < 2) deck = [...Array(TOTAL)].map((_,i)=>i+1).sort(()=>Math.random()-.5);
  let n; do { n = deck.pop(); if(!deck.length) deck = [...Array(TOTAL)].map((_,i)=>i+1).sort(()=>Math.random()-.5); } while (avoid.includes(n));
  return n;
}
const src = n => `pages/${n}.jpg`;
for (let i=1;i<=TOTAL;i++) new Image().src = src(i); // preload

const panels = ['p1','p2'].map(id => {
  const el = document.getElementById(id);
  return { el, base: el.querySelector('.base'), top: el.querySelector('.top'), ink: el.querySelector('.ink'), cur: 0 };
});
const first = [draw([]), 0]; first[1] = draw([first[0]]);
panels.forEach((p,i)=>{
  p.base.onerror = () => {
    p.el.style.cssText += ';display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:15px;line-height:1.6;color:#ffb800';
    if(!p.el.querySelector('.err')) p.el.insertAdjacentHTML('beforeend','<div class="err" style="position:relative;z-index:5">Cannot load <b>'+p.base.getAttribute('src')+'</b><br>Keep slideshow.html in the same folder as your <b>pages</b> folder.</div>');
  };
  p.cur = first[i]; p.base.src = src(first[i]);
});

// splash polygon: jagged blob with long "arms" like a paint burst
function makeSplash(){
  const N = 72, r = Array.from({length:N}, () => .72 + Math.random()*.38);
  const arms = 7 + Math.floor(Math.random()*5);
  for (let a=0;a<arms;a++){
    const c = Math.floor(Math.random()*N), len = 1.5 + Math.random()*.9;
    for (let k=-2;k<=2;k++) r[(c+k+N)%N] = Math.max(r[(c+k+N)%N], len*(1-Math.abs(k)*.28));
  }
  return r;
}
function poly(cx, cy, R, shape){
  const N = shape.length;
  return 'polygon(' + shape.map((s,i)=>{
    const a = i/N*Math.PI*2;
    return `${(cx+Math.cos(a)*R*s).toFixed(1)}px ${(cy+Math.sin(a)*R*s).toFixed(1)}px`;
  }).join(',') + ')';
}
const ease = t => 1 - Math.pow(1-t, 3.2);

// droplets
let drops = [];
function burst(px, ox, oy, power){
  const rect = px.el.offsetLeft, top = px.el.offsetTop;
  for (let i=0;i<46;i++){
    const a = Math.random()*Math.PI*2, v = (2+Math.random()*9)*power;
    drops.push({x:rect+ox, y:top+oy, vx:Math.cos(a)*v, vy:Math.sin(a)*v-2, r:2+Math.random()*7,
      c:COLORS[Math.floor(Math.random()*COLORS.length)], life:1, d:.008+Math.random()*.014});
  }
}
(function loop(){
  ctx.clearRect(0,0,1600,600);
  drops = drops.filter(d=>d.life>0);
  for (const d of drops){
    d.x+=d.vx; d.y+=d.vy; d.vy+=.28; d.vx*=.985; d.life-=d.d;
    ctx.globalAlpha=Math.max(d.life,0); ctx.fillStyle=d.c;
    ctx.beginPath(); ctx.ellipse(d.x,d.y,d.r*Math.max(d.life,.2),d.r*(1+Math.abs(d.vy)*.04)*Math.max(d.life,.2),Math.atan2(d.vy,d.vx)+Math.PI/2,0,7); ctx.fill();
  }
  ctx.globalAlpha=1; requestAnimationFrame(loop);
})();

function splash(p, nextNum, delay){
  const w = p.el.clientWidth, h = p.el.clientHeight;
  const cx = w*(.2+Math.random()*.6), cy = h*(.2+Math.random()*.6);
  const shape = makeSplash(), maxR = Math.hypot(w,h)/.72;
  p.top.src = src(nextNum);
  setTimeout(()=>{
    burst(p, cx, cy, 1.2);
    const t0 = performance.now();
    (function step(now){
      const t = Math.min((now-t0)/DUR,1), e = ease(t);
      p.ink.style.clipPath = poly(cx,cy,maxR*e,shape);
      p.top.style.clipPath = poly(cx,cy,maxR*e*.9,shape);   // ink rim trails the photo
      p.top.style.transform = `scale(${1.18-.18*e})`;
      if (t<1) requestAnimationFrame(step);
      else {
        p.base.src = p.top.src; p.cur = nextNum;
        p.top.style.clipPath = p.ink.style.clipPath = 'circle(0)';
        p.top.style.transform = 'scale(1)';
      }
    })(t0);
  }, delay);
}

function next(){
  const a = draw([panels[0].cur, panels[1].cur]);
  const b = draw([panels[0].cur, panels[1].cur, a]);
  const order = Math.random()<.5;
  splash(panels[0], a, order?0:350);
  splash(panels[1], b, order?350:0);
  bar.style.transition='none'; bar.style.width='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.transition=`width ${HOLD}ms linear`; bar.style.width='100%'; }));
}

let timer;
function schedule(){ clearTimeout(timer); timer = setTimeout(()=>{ next(); schedule(); }, HOLD + DUR + 350); }
panels.forEach(p => p.el.addEventListener('click', ()=>{ next(); schedule(); }));
addEventListener('keydown', e => { if (e.code==='Space'||e.code==='ArrowRight'){ e.preventDefault(); next(); schedule(); }});

// first bar fill
requestAnimationFrame(()=>{ bar.style.transition=`width ${HOLD}ms linear`; bar.style.width='100%'; });
schedule();
</script>
</body>
</html>
