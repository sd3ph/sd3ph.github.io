<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern Dynamic Slideshow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slideshow-container {
            width: 1536px;
            height: 672px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            background: #111827;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slide-panel {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .slide-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transform: scale(1);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide-panel img.active {
            opacity: 1;
            transform: scale(1.03);
            z-index: 2;
        }

        /* Flash overlay effect */
        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
        }

        @keyframes flashAnim {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        .trigger-flash {
            animation: flashAnim 0.6s ease-out forwards;
        }

        /* Modern UI Indicator */
        .indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20;
        }
    </style>
</head>
<body>

<div class="slideshow-container" id="slideshow">
    <div class="flash" id="flashOverlay"></div>
    
    <!-- Left Panel -->
    <div class="slide-panel" id="panel1">
        <img src="pages/1.JPG" class="active" alt="Slide 1">
        <img src="pages/2.JPG" alt="Slide 2">
        <img src="pages/3.JPG" alt="Slide 3">
        <img src="pages/4.JPG" alt="Slide 4">
        <img src="pages/5.JPG" alt="Slide 5">
        <img src="pages/6.JPG" alt="Slide 6">
        <img src="pages/7.JPG" alt="Slide 7">
        <img src="pages/8.JPG" alt="Slide 8">
        <img src="pages/9.JPG" alt="Slide 9">
        <img src="pages/10.JPG" alt="Slide 10">
    </div>

    <!-- Right Panel -->
    <div class="slide-panel" id="panel2">
        <img src="pages/2.JPG" class="active" alt="Slide 2">
        <img src="pages/3.JPG" alt="Slide 3">
        <img src="pages/4.JPG" alt="Slide 4">
        <img src="pages/5.JPG" alt="Slide 5">
        <img src="pages/6.JPG" alt="Slide 6">
        <img src="pages/7.JPG" alt="Slide 7">
        <img src="pages/8.JPG" alt="Slide 8">
        <img src="pages/9.JPG" alt="Slide 9">
        <img src="pages/10.JPG" alt="Slide 10">
        <img src="pages/1.JPG" alt="Slide 1">
    </div>

    <div class="indicator">DYNAMIC DUAL DISPLAY (FIG FOLDER)</div>
</div>

<script>
    const panel1Images = document.querySelectorAll('#panel1 img');
    const panel2Images = document.querySelectorAll('#panel2 img');
    const flashOverlay = document.getElementById('flashOverlay');

    let currentIndex1 = 0;
    let currentIndex2 = 1;
    const totalImages = panel1Images.length;

    // Array of random transition effects
    const effects = [
        (img, dir) => { // Zoom & Fade
            img.style.transform = dir === 'in' ? 'scale(1.15) rotate(1deg)' : 'scale(0.95)';
        },
        (img, dir) => { // Slide & Blur
            img.style.transform = dir === 'in' ? 'translateY(0) scale(1.03)' : 'translateY(-30px) scale(1.03)';
        },
        (img, dir) => { // Lateral Shift
            img.style.transform = dir === 'in' ? 'translateX(0) scale(1.03)' : 'translateX(40px) scale(1.03)';
        }
    ];

    function changeSlides() {
        // Trigger Flash Effect
        flashOverlay.classList.remove('trigger-flash');
        void flashOverlay.offsetWidth; // trigger reflow
        flashOverlay.classList.add('trigger-flash');

        // Remove active class from current
        panel1Images[currentIndex1].classList.remove('active');
        panel2Images[currentIndex2].classList.remove('active');

        // Pick random next indices independently
        let nextIndex1, nextIndex2;
        do {
            nextIndex1 = Math.floor(Math.random() * totalImages);
            nextIndex2 = Math.floor(Math.random() * totalImages);
        } while (nextIndex1 === currentIndex1 || nextIndex2 === currentIndex2 || nextIndex1 === nextIndex2);

        currentIndex1 = nextIndex1;
        currentIndex2 = nextIndex2;

        // Apply random transition style
        const randomEffect = effects[Math.floor(Math.random() * effects.length)];
        
        panel1Images[currentIndex1].style.transition = 'all 1.2s cubic-bezier(0.16, 1, 0.3, 1)';
        panel2Images[currentIndex2].style.transition = 'all 1.2s cubic-bezier(0.16, 1, 0.3, 1)';

        randomEffect(panel1Images[currentIndex1], 'in');
        randomEffect(panel2Images[currentIndex2], 'in');

        // Set active
        panel1Images[currentIndex1].classList.add('active');
        panel2Images[currentIndex2].classList.add('active');
    }

    // Change slides every 3.5 seconds
    setInterval(changeSlides, 3500);
</script>

</body>
</html>
